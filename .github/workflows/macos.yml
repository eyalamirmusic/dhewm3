name: Testbuild for macOS
run-name: testbuild_macos
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - edited
      - opened
      - synchronize
concurrency:
  # Cancel concurrent workflows for the same PR or commit hash.
  group: ${{github.workflow}}-${{github.event_name == 'pull_request' && github.head_ref || github.sha}}
  cancel-in-progress: true
jobs:
  build_macos_universal:
    runs-on: macos-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Build universal SDL3 and openal-soft
      # Homebrew only ships single-architecture libraries, so a universal dhewm3
      # needs universal builds of its dependencies.
      run: |
        set -e
        mkdir -p deps && cd deps
        git clone --depth 1 -b release-3.4.14 https://github.com/libsdl-org/SDL.git sdl3
        git clone --depth 1 -b 1.25.2 https://github.com/kcat/openal-soft.git openal
        for dep in sdl3 openal; do
          cmake -S $dep -B build-$dep \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DALSOFT_EXAMPLES=OFF -DALSOFT_UTILS=OFF
          cmake --build build-$dep --parallel
          cmake --install build-$dep
        done
    - name: Build
      run: |
        cmake -B build -DCMAKE_PREFIX_PATH="$PWD/deps/prefix"
        cmake --build build --parallel
    - name: Create testbuild package
      run: |
        # Create release directory tree
        export PKGDIR="dhewm3-macos-$(git rev-parse --short HEAD)"
        echo "pkgname=$PKGDIR" >> $GITHUB_ENV
        mkdir -p publish/$PKGDIR/base
        mkdir publish/$PKGDIR/d3xp
        # Copy release assets
        cp -r build/neo/dhewm3.app publish/$PKGDIR/
        cp build/neo/base.dylib build/neo/d3xp.dylib publish/$PKGDIR/
        # Copy the universal SDL3 and OpenAL the game was linked against
        cp deps/prefix/lib/libSDL3.0.dylib deps/prefix/lib/libopenal.*.dylib publish/$PKGDIR/
        # Copy misc assets
        cp base/gamepad.cfg publish/$PKGDIR/base/
        cp base/gamepad-d3xp.cfg publish/$PKGDIR/d3xp/
        cp COPYING.txt publish/$PKGDIR/
        cp README.md publish/$PKGDIR/README.txt
        cp Changelog.md publish/$PKGDIR/Changelog.txt
        cp Configuration.md publish/$PKGDIR/Configuration.txt
    - name: Verify the binaries are universal
      run: |
        lipo -info publish/${{ env.pkgname }}/dhewm3.app/Contents/MacOS/dhewm3
        lipo -info publish/${{ env.pkgname }}/base.dylib
        lipo -info publish/${{ env.pkgname }}/d3xp.dylib
    - name: Upload testbuild package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.pkgname }}
        path: publish/
        if-no-files-found: error
