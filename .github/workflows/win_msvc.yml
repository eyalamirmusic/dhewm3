name: Testbuild for x86 and x86_64 Windows
run-name: testbuild_windows
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - edited
      - opened
      - synchronize
concurrency:
  # Cancel concurrent workflows for the same PR or commit hash.
  group: ${{github.workflow}}-${{github.event_name == 'pull_request' && github.head_ref || github.sha}}
  cancel-in-progress: true
jobs:
  build_win_msvc:
    runs-on: windows-latest
    defaults:
      run:
        # use git bash for all steps (unless specified otherwise per step)
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            triplet: x86-windows
            pkgsuffix: win32
          - arch: x64
            triplet: x64-windows
            pkgsuffix: win64
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Install build dependencies
      # vcpkg is preinstalled on the windows runners ($VCPKG_INSTALLATION_ROOT)
      run: |
        vcpkg install sdl3:${{ matrix.triplet }} openal-soft:${{ matrix.triplet }} curl:${{ matrix.triplet }}
    - name: Build
      run: |
        # NOTE: not setting -G "Visual Studio 17 2022" so it just uses the default VS version it can find
        cmake -A ${{ matrix.arch }} \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          -B build
        time cmake --build build --config RelWithDebInfo
    - name: Create testbuild package
      run: |
        # Create release directory tree
        export PKGDIR="dhewm3-${{ matrix.pkgsuffix }}-$(git rev-parse --short HEAD)"
        echo "pkgname=$PKGDIR" >> $GITHUB_ENV
        mkdir -p publish/$PKGDIR/base
        mkdir publish/$PKGDIR/d3xp
        # debug symbols (*.pdb) are put in a separate zip
        mkdir -p debug-syms/$PKGDIR
        # Copy release assets (cmake also copies the vcpkg DLLs next to the binaries)
        cd build/neo/RelWithDebInfo
        cp dhewm3.exe base.dll d3xp.dll *.dll ../../../publish/$PKGDIR/
        cp -r *.pdb ../../../debug-syms/$PKGDIR/
        cd ../../..
        # Copy misc assets
        cp base/gamepad.cfg publish/$PKGDIR/base/
        cp base/gamepad-d3xp.cfg publish/$PKGDIR/d3xp/
        cp COPYING.txt publish/$PKGDIR/
        echo "dhewm3 for ${{ matrix.pkgsuffix }}, built $(date)" > publish/$PKGDIR/README.txt
        echo -e "from ${{ github.ref_name }} commit ${{ github.sha }}\n" >> publish/$PKGDIR/README.txt
        cat README.md >> publish/$PKGDIR/README.txt
        cp Changelog.md publish/$PKGDIR/Changelog.txt
        cp Configuration.md publish/$PKGDIR/Configuration.txt
    - name: Upload testbuild package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.pkgname }}
        path: publish/
        if-no-files-found: error
    - name: Upload testbuild debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.pkgname }}-debugsyms
        path: debug-syms/
        if-no-files-found: error
