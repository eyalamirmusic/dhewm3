// Records the reference render demo that Phase 1 is measured against.
//
// Run it through regression/gate.sh rather than by hand - the script points
// fs_savepath at regression/work so nothing here touches your real config.
//
// The camera stops are the map's own info_location entities (the named areas
// the HUD shows), read out of maps/game/demo_mars_city1.map. They are spread
// across the whole level, so the tour walks the renderer through most of the
// content the demo pk4 has: per-pixel lighting, stencil shadows, in-world GUI
// surfaces, animated NPCs and particles.
//
// `wait N` counts command-buffer executions, not frames - the buffer is run
// several times per frame, so N is roughly 6x the number of frames it holds.

seta r_fullscreen 0
seta r_customWidth 640
seta r_customHeight 480
seta r_multiSamples 0
seta com_showFPS 0
seta s_noSound 1
seta com_disableAutoSaves 1

// devmap, not map: cheats have to be on for noclip/setviewpos.
devmap game/demo_mars_city1

// The level opens on a scripted cinematic that owns the camera. Sit through it
// before taking the view over, otherwise the tour records the cinematic instead.
wait 3000

god
notarget
noclip

recordDemo reference

setviewpos    264 -1320 160 180
wait 120
setviewpos     32 -1296 224  90
wait 120
setviewpos   -328 -1336 224   0
wait 120
setviewpos   -300 -1939 116 270
wait 120
setviewpos   -846 -1340 219  45
wait 120
setviewpos  -1248 -1254 268 135
wait 120
setviewpos  -1748 -1340 268  90
wait 120
setviewpos  -2132 -1524 268 225
wait 120
setviewpos  -2500 -1116 252 180
wait 120
setviewpos  -2852 -1412 204   0
wait 120
setviewpos  -2560 -1916 204 315
wait 120
setviewpos  -3070 -2294 204  90
wait 120
setviewpos  -3148 -2776 204 180
wait 120
setviewpos  -3644 -2564 266 270
wait 120
setviewpos  -2308 -3052 272   0
wait 120
setviewpos  -3774 -3212 266  45
wait 120
setviewpos  -3632 -3416 192 135
wait 120
setviewpos   -222 -2205 116 225
wait 120

stopRecording
wait 60
quit
