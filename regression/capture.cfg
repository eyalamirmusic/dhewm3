// Replays regression/reference.demo and dumps every frame as a .tga.
//
// Playback is frame-exact: the demo carries the render world per frame, so the
// output does not depend on how fast this machine ran. Two captures of the same
// build are byte-identical, which is what makes them usable as a gate.
//
// com_aviDemoSamples must stay at 1. Above 1 the screenshot path jitters the
// projection to supersample, and the gate stops being a comparison of the
// renderer alone.

seta r_fullscreen 0
seta r_customWidth 640
seta r_customHeight 480
seta r_multiSamples 0
seta com_showFPS 0
seta s_noSound 1
seta com_aviDemoWidth 320
seta com_aviDemoHeight 240
seta com_aviDemoSamples 1
seta com_aviDemoTics 2

aviDemo reference
